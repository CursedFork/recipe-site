<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    A bowl with steam. Deliberately simple: a favicon is read at 16 pixels, so
    anything with fine detail turns to mush. Drawn in the site's accent, with
    the dark-mode variant so it stays legible on a dark browser tab.

    It is a neutral mark on purpose. The site name is still a placeholder, so
    anything built from initials would have to be redrawn later.
  -->
  <style>
    .mark { fill: #4F6238; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #A7BE8E; }
    }
  </style>

  <g class="mark">
    <!-- Steam: two short strokes, offset so they do not read as a pause sign. -->
    <rect x="10.2" y="3.6" width="2.2" height="7.8" rx="1.1" />
    <rect x="15.9" y="2.2" width="2.2" height="9.2" rx="1.1" />
    <rect x="21.6" y="3.6" width="2.2" height="7.8" rx="1.1" />

    <!-- The bowl: a flat rim and a rounded body. -->
    <rect x="2.4" y="13.4" width="27.2" height="3" rx="1.5" />
    <path d="M5 17.6h22a1 1 0 0 1 1 1.1 12 12 0 0 1-24 0 1 1 0 0 1 1-1.1z" />
  </g>
</svg>
